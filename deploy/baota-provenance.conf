# Install in Baota's extension directory for api.567.wiki.
# This location is intentionally isolated from the site's existing root proxy.
location ^~ /provenance/ {
    client_max_body_size 10m;
    client_body_buffer_size 10m;
    client_body_in_file_only off;

    proxy_pass http://127.0.0.1:18086/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-OpenAI-API-Key $http_x_openai_api_key;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 40s;
    proxy_read_timeout 40s;
}
